<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="favicon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Pozadinski tamni krug medaljona -->
  <circle cx="16" cy="16" r="15" fill="#09090B" stroke="#A855F7" stroke-width="1.8" />
  <circle cx="16" cy="16" r="12" fill="none" stroke="#27272A" stroke-width="0.8" stroke-dasharray="2 2" />
  
  <!-- Okomiti mač u središtu -->
  <path d="M 15 5 L 17 5 L 17 26 L 16 28 L 15 26 Z" fill="#E4E4E7" stroke="#09090B" stroke-width="0.5" />
  <line x1="16" y1="5" x2="16" y2="26" stroke="#38BDF8" stroke-width="0.7" />
  <!-- Branik mača -->
  <rect x="13" y="11" width="6" height="1.6" rx="0.4" fill="#F59E0B" />

  <!-- Q aureola i kruna na vrhu -->
  <circle cx="16" cy="9" r="4.5" fill="none" stroke="#A855F7" stroke-width="1.4" filter="url(#favicon-glow)" />
  <line x1="18.5" y1="11.5" x2="20.5" y2="13.5" stroke="#A855F7" stroke-width="1.4" stroke-linecap="round" />
  <!-- Dukatno zlato krune -->
  <path d="M 14.5 7 L 15.2 8 L 16 7 L 16.8 8 L 17.5 7 L 17 9.5 L 15 9.5 Z" fill="#F59E0B" />
</svg>
